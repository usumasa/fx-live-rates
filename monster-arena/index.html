<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>モンスターアリーナ</title>
<style>
  :root{
    --sky-top:#8fd3ff;
    --sky-bottom:#d7f5c9;
    --accent:#ffb703;
  }
  html,body{
    margin:0; padding:0; width:100%; min-height:100%;
    font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c",system-ui,sans-serif;
    background:linear-gradient(var(--sky-top), var(--sky-bottom)) fixed;
    color:#3a2a1a;
    -webkit-tap-highlight-color:transparent;
  }
  *{ box-sizing:border-box; }
  #app{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px)); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:#fff8e6; border:4px solid var(--accent); border-radius:18px;
    padding:12px 20px; font-size:16px; font-weight:900; color:#5a4020;
    box-shadow:0 6px 0 rgba(0,0,0,.15); cursor:pointer; user-select:none;
    -webkit-user-select:none;
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.15); }
  .btn.primary{ background:var(--accent); color:#4a2f00; }
  .btn.small{ padding:8px 14px; font-size:13px; border-width:3px; box-shadow:0 4px 0 rgba(0,0,0,.15); }
  .btn.wide{ width:100%; max-width:360px; }
  .btn:disabled, .btn.disabled{ opacity:.4; pointer-events:none; }

  h1.title{ font-size:22px; margin:4px 0 12px; text-align:center; }
  h2.section{ font-size:16px; margin:16px 0 8px; align-self:flex-start; }

  .card{
    background:#fff8e6cc; border:4px solid var(--accent); border-radius:20px;
    padding:14px; width:100%; max-width:420px; box-shadow:0 8px 0 rgba(0,0,0,.1);
  }

  .monIcon{ width:100%; }
  .monIcon svg{ width:100%; display:block; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:10px; width:100%; max-width:460px; }
  .monCard{
    background:#fff; border:3px solid #e8d7ae; border-radius:16px; padding:6px;
    text-align:center; cursor:pointer; position:relative;
  }
  .monCard.selected{ border-color:#2b9e4a; box-shadow:0 0 0 3px #2b9e4a55; }
  .monCard.disabled{ opacity:.35; pointer-events:none; }
  .monCard .nm{ font-size:11px; font-weight:bold; margin-top:2px; }
  .monCard .lv{ font-size:10px; color:#8a6a3a; }
  .monCard .badge{
    position:absolute; top:2px; right:4px; background:#2b9e4a; color:#fff;
    border-radius:10px; font-size:10px; padding:1px 6px; font-weight:bold;
  }

  .navRow{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:14px; }

  #toast{
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
    background:#3a2a1acc; color:#fff; padding:10px 18px; border-radius:20px;
    font-size:14px; font-weight:bold; z-index:50; opacity:0; pointer-events:none;
    transition:opacity .25s;
  }
  #toast.show{ opacity:1; }

  /* battle screen */
  .battleField{
    width:100%; max-width:460px; background:linear-gradient(#c9ecff,#bfe8a8);
    border-radius:20px; border:4px solid #7fb84a; padding:14px; position:relative;
    min-height:260px;
  }
  .battleSide{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .battleSide.enemy{ flex-direction:row; }
  .battleSide .monWrap{ width:78px; flex:0 0 auto; }
  .battleSide .info{ flex:1; background:#fffbe8; border:2px solid #e8d7ae; border-radius:12px; padding:6px 10px; }
  .hpBarOuter{ background:#ddd; border-radius:8px; height:10px; overflow:hidden; margin-top:4px; }
  .hpBarInner{ height:100%; background:#4caf50; transition:width .3s; }
  .hpBarInner.mid{ background:#ffb703; }
  .hpBarInner.low{ background:#e5443f; }
  .hpText{ font-size:11px; text-align:right; margin-top:2px; }

  #battleLog{
    background:#fff; border:2px solid #e8d7ae; border-radius:12px; padding:8px 10px;
    font-size:13px; min-height:44px; width:100%; max-width:460px; margin-top:10px;
    line-height:1.5;
  }
  .actionGrid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; max-width:460px; margin-top:10px; }

  .familyTag{ display:inline-block; font-size:10px; padding:1px 6px; border-radius:8px; color:#fff; margin-right:2px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<!-- Online battles need a free Firebase Realtime Database project; see README for setup steps.
     Until FIREBASE_CONFIG below is filled in, everything except online battles works normally. -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
"use strict";

/* ============================== DATA ============================== */
var FAMILIES = {
  hono:  { name:"ほのお", color:"#ff6b4a", accent:"flame", shape:"upright" },
  mizu:  { name:"みず",   color:"#4ab3ff", accent:"drop",  shape:"wide" },
  kusa:  { name:"くさ",   color:"#6bcf5a", accent:"leaf",  shape:"scallop" },
  kemo:  { name:"けもの", color:"#c98b4a", accent:"ear",   shape:"quad" },
  aku:   { name:"あくま", color:"#8a5ac9", accent:"horn",  shape:"peak" }
};
// each family's monsters share a body silhouette, not just a color/head-accent,
// so the 15 species read as visibly different creatures rather than recolored clones
var SHAPES = {
  upright: { rx:56, ry:58, cy:118, legs:2 },
  wide:    { rx:70, ry:46, cy:128, legs:2 },
  scallop: { rx:60, ry:54, cy:120, legs:2 },
  quad:    { rx:72, ry:42, cy:130, legs:4 },
  peak:    { rx:56, ry:56, cy:120, legs:2 }
};
var STRONG_AGAINST = { hono:"kusa", kusa:"mizu", mizu:"hono" };
var TYPE_FAMS = ["hono","mizu","kusa"];

function typeMultiplier(aFam, dFam){
  if(!aFam || !dFam) return 1;
  if(TYPE_FAMS.indexOf(aFam)===-1 || TYPE_FAMS.indexOf(dFam)===-1) return 1;
  if(STRONG_AGAINST[aFam]===dFam) return 1.5;
  if(STRONG_AGAINST[dFam]===aFam) return 0.67;
  return 1;
}
function mkMove(name, power, uses, unlockLevel){ return { name:name, power:power, uses: uses||null, unlockLevel: unlockLevel||1 }; }
// support moves boost the whole team (not just the active monster) for a few hits, so the
// boost is still there after switching; see BUFF_MULTIPLIER/BUFF_DURATION in the battle engine
function mkSupportMove(name, statKey, uses, unlockLevel){ return { name:name, power:0, uses:uses, unlockLevel:unlockLevel, kind:'support', statKey:statKey }; }
function atkCry(){ return mkSupportMove("とうこんのさけび","atk",3,15); }
function defWall(){ return mkSupportMove("てっぺきのかまえ","def",3,15); }

var SPECIES = {
  flame:   { name:"ヒノコ",     fams:["hono"],       base:{hp:10,atk:8,def:4,spd:5}, growth:{hp:3,atk:2,def:1,spd:1.5},
             attack:mkMove("ひっかき",1.0),
             moves:[ mkMove("ひのたま",1.6,3,1), mkMove("おおひのたま",2.0,2,10), atkCry(), mkMove("えんごくのほのお",2.6,1,20) ] },
  aqua:    { name:"ポチャポン", fams:["mizu"],       base:{hp:12,atk:5,def:8,spd:4}, growth:{hp:3,atk:1.5,def:2,spd:1},
             attack:mkMove("たいあたり",1.0),
             moves:[ mkMove("みずでっぽう",1.6,3,1), mkMove("うずしお",2.0,2,10), defWall(), mkMove("だいかいしょう",2.6,1,20) ] },
  leaf:    { name:"ハッパン",   fams:["kusa"],       base:{hp:14,atk:5,def:6,spd:4}, growth:{hp:3.5,atk:1.5,def:1.5,spd:1},
             attack:mkMove("たいあたり",1.0),
             moves:[ mkMove("はっぱカッター",1.6,3,1), mkMove("つるのムチ",2.0,2,10), defWall(), mkMove("だいしぜんのいかり",2.6,1,20) ] },
  beast:   { name:"キバウル",   fams:["kemo"],       base:{hp:10,atk:6,def:4,spd:8}, growth:{hp:2.5,atk:1.5,def:1,spd:2},
             attack:mkMove("ひっかき",1.0),
             moves:[ mkMove("れんぞくアタック",1.6,3,1), mkMove("きょうぼうがみつき",2.0,2,10), atkCry(), mkMove("げきりんのつめ",2.6,1,20) ] },
  dark:    { name:"マガトル",   fams:["aku"],        base:{hp:8,atk:9,def:4,spd:6},  growth:{hp:2,atk:2.5,def:1,spd:1.5},
             attack:mkMove("たいあたり",1.0),
             moves:[ mkMove("あくまのつめ",1.6,3,1), mkMove("あんこくげり",2.0,2,10), atkCry(), mkMove("まおうのいかり",2.6,1,20) ] },

  steam:    { name:"ユゲムー",   fams:["hono","mizu"], base:{hp:11,atk:7,def:6,spd:5}, growth:{hp:3,atk:2,def:1.5,spd:1.5},
              attack:mkMove("たいあたり",1.0),
              moves:[ mkMove("スチームブラスト",1.6,3,1), mkMove("じょうききり",2.0,2,10), atkCry(), mkMove("だいばくはつじょうき",2.6,1,20) ] },
  scorch:   { name:"コゲッパ",   fams:["hono","kusa"], base:{hp:12,atk:7,def:5,spd:5}, growth:{hp:3,atk:2,def:1,spd:1},
              attack:mkMove("ひっかき",1.0),
              moves:[ mkMove("こげくさアタック",1.6,3,1), mkMove("はいじんあらし",2.0,2,10), atkCry(), mkMove("だいえんじょう",2.6,1,20) ] },
  wildfire: { name:"モウカロン", fams:["hono","kemo"], base:{hp:10,atk:7,def:4,spd:7}, growth:{hp:3,atk:2,def:1,spd:2},
              attack:mkMove("ひっかき",1.0),
              moves:[ mkMove("もうかえん",1.6,3,1), mkMove("れっかしん",2.0,2,10), atkCry(), mkMove("のやきつくし",2.6,1,20) ] },
  hellfire: { name:"エンマヒ",   fams:["hono","aku"],  base:{hp:9,atk:9,def:4,spd:6},  growth:{hp:2.5,atk:2,def:1,spd:1.5},
              attack:mkMove("たいあたり",1.0),
              moves:[ mkMove("ごうかのほのお",1.6,3,1), mkMove("じごくのほのお",2.0,2,10), atkCry(), mkMove("えんまのさばき",2.6,1,20) ] },
  swamp:    { name:"ドロモリ",   fams:["mizu","kusa"], base:{hp:13,atk:5,def:7,spd:4}, growth:{hp:3,atk:1.5,def:2,spd:1},
              attack:mkMove("たいあたり",1.0),
              moves:[ mkMove("どろなみ",1.6,3,1), mkMove("ぬまのわな",2.0,2,10), defWall(), mkMove("おおぬまじごく",2.6,1,20) ] },
  otter:    { name:"ラッコロ",   fams:["mizu","kemo"], base:{hp:11,atk:6,def:6,spd:6}, growth:{hp:3,atk:1.5,def:1.5,spd:1.5},
              attack:mkMove("たいあたり",1.0),
              moves:[ mkMove("アクアテール",1.6,3,1), mkMove("かいりゅうしょうげき",2.0,2,10), defWall(), mkMove("だいうずしお",2.6,1,20) ] },
  abyss:    { name:"ヤミウズ",   fams:["mizu","aku"],  base:{hp:10,atk:7,def:6,spd:5}, growth:{hp:2.5,atk:2,def:1.5,spd:1},
              attack:mkMove("たいあたり",1.0),
              moves:[ mkMove("あんこくウェーブ",1.6,3,1), mkMove("しんえんのちから",2.0,2,10), defWall(), mkMove("ぜつぼうのふち",2.6,1,20) ] },
  sprout:   { name:"モフバナ",   fams:["kusa","kemo"], base:{hp:12,atk:6,def:5,spd:6}, growth:{hp:3,atk:1.5,def:1,spd:1.5},
              attack:mkMove("たいあたり",1.0),
              moves:[ mkMove("はなふぶき",1.6,3,1), mkMove("せいめいのはどう",2.0,2,10), defWall(), mkMove("だいちのめぐみ",2.6,1,20) ] },
  thorn:    { name:"トゲドク",   fams:["kusa","aku"],  base:{hp:11,atk:7,def:5,spd:5}, growth:{hp:3,atk:2,def:1,spd:1},
              attack:mkMove("たいあたり",1.0),
              moves:[ mkMove("どくのトゲ",1.6,3,1), mkMove("もうどくのきり",2.0,2,10), defWall(), mkMove("ぜつぼうのどく",2.6,1,20) ] },
  werewolf: { name:"ガルナイト", fams:["kemo","aku"],  base:{hp:9,atk:8,def:4,spd:7},  growth:{hp:2,atk:2,def:1,spd:2},
              attack:mkMove("ひっかき",1.0),
              moves:[ mkMove("ムーンファング",1.6,3,1), mkMove("まんげつげきりん",2.0,2,10), atkCry(), mkMove("えいごうのおおかみ",2.6,1,20) ] }
};

var SYNTHESIS_TABLE = {};
Object.keys(SPECIES).forEach(function(id){
  var sp = SPECIES[id];
  if(sp.fams.length === 2){
    SYNTHESIS_TABLE[sp.fams.slice().sort().join("|")] = id;
  }
});
function synthesize(idA, idB){
  var a = SPECIES[idA], b = SPECIES[idB];
  if(!a || !b || a.fams.length!==1 || b.fams.length!==1 || idA===idB) return null;
  return SYNTHESIS_TABLE[[a.fams[0], b.fams[0]].sort().join("|")] || null;
}
var STAT_KEYS = ['hp','atk','def','spd'];
var STAT_LABEL = { hp:'HP', atk:'こうげき', def:'ぼうぎょ', spd:'すばやさ' };
// every level-up adds exactly 1 point to exactly one stat (player's choice from Lv2 onward).
// a freshly-created monster (starter/catch/synthesis) gets its early levels distributed
// evenly round-robin, since the player never chose those.
function defaultStatBonus(level){
  var b = { hp:0, atk:0, def:0, spd:0 };
  for(var i=0;i<level-1;i++){ b[STAT_KEYS[i%4]]++; }
  return b;
}
function statFromBonus(speciesId, statBonus, stat){
  var sp = SPECIES[speciesId];
  return Math.round(sp.base[stat] + sp.growth[stat] * (statBonus ? statBonus[stat] : 0));
}
function allStatsFromBonus(speciesId, statBonus){
  return { hp:statFromBonus(speciesId,statBonus,'hp'), atk:statFromBonus(speciesId,statBonus,'atk'), def:statFromBonus(speciesId,statBonus,'def'), spd:statFromBonus(speciesId,statBonus,'spd') };
}
function primaryType(speciesId){
  var fams = SPECIES[speciesId].fams;
  for(var i=0;i<fams.length;i++){ if(TYPE_FAMS.indexOf(fams[i])!==-1) return fams[i]; }
  return null;
}
function computeDamage(atkSpeciesId, defSpeciesId, movePower, atk, def, rng){
  var mult = typeMultiplier(primaryType(atkSpeciesId), primaryType(defSpeciesId));
  var raw = Math.max(1, atk*movePower - def*0.4);
  var variance = 0.9 + rng()*0.2;
  return { damage: Math.max(1, Math.round(raw*mult*variance)), multiplier: mult };
}

var BASE_SPECIES_IDS = Object.keys(SPECIES).filter(function(id){ return SPECIES[id].fams.length===1; });

/* ============================== SVG ART ============================== */
function hexToRgb(hex){ var h=hex.replace('#',''); return {r:parseInt(h.substr(0,2),16),g:parseInt(h.substr(2,2),16),b:parseInt(h.substr(4,2),16)}; }
function rgbToHex(r,g,b){ function c(v){ return Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0'); } return '#'+c(r)+c(g)+c(b); }
function mixColor(a,b){ var A=hexToRgb(a),B=hexToRgb(b); return rgbToHex((A.r+B.r)/2,(A.g+B.g)/2,(A.b+B.b)/2); }
function shade(hex, amt){ var c=hexToRgb(hex); return rgbToHex(c.r+amt,c.g+amt,c.b+amt); }

function accentFlame(cx, color){
  return '<path d="M'+(cx-11)+' 55 C'+(cx-15)+' 40,'+(cx-4)+' 26,'+cx+' 14 C'+(cx+4)+' 27,'+(cx+13)+' 39,'+(cx+9)+' 55 Z" fill="'+color+'"/>'+
         '<path d="M'+(cx-5)+' 55 C'+(cx-7)+' 46,'+(cx-2)+' 38,'+cx+' 32 C'+(cx+2)+' 40,'+(cx+5)+' 47,'+(cx+3)+' 55 Z" fill="'+shade(color,40)+'"/>';
}
function accentDrop(cx, color){
  return '<path d="M'+cx+' 14 C'+(cx+13)+' 32,'+(cx+13)+' 46,'+cx+' 55 C'+(cx-13)+' 46,'+(cx-13)+' 32,'+cx+' 14 Z" fill="'+color+'"/>'+
         '<ellipse cx="'+(cx-3)+'" cy="40" rx="3" ry="6" fill="'+shade(color,50)+'" opacity=".7"/>';
}
function accentLeaf(cx, color){
  return '<path d="M'+cx+' 55 C'+cx+' 36,'+(cx-16)+' 22,'+(cx-2)+' 14 C'+(cx+9)+' 24,'+(cx+11)+' 42,'+cx+' 55 Z" fill="'+color+'"/>'+
         '<line x1="'+cx+'" y1="34" x2="'+(cx-6)+'" y2="20" stroke="'+shade(color,-40)+'" stroke-width="2"/>'+
         '<line x1="'+cx+'" y1="55" x2="'+cx+'" y2="62" stroke="#5a4632" stroke-width="3" stroke-linecap="round"/>';
}
function accentEarPair(cx, color){
  return '<path d="M'+(cx-20)+' 50 C'+(cx-28)+' 28,'+(cx-16)+' 16,'+(cx-9)+' 34 Z" fill="'+color+'"/>'+
         '<path d="M'+(cx+20)+' 50 C'+(cx+28)+' 28,'+(cx+16)+' 16,'+(cx+9)+' 34 Z" fill="'+color+'"/>'+
         '<path d="M'+(cx-18)+' 46 C'+(cx-22)+' 32,'+(cx-15)+' 26,'+(cx-11)+' 35 Z" fill="'+shade(color,-30)+'"/>'+
         '<path d="M'+(cx+18)+' 46 C'+(cx+22)+' 32,'+(cx+15)+' 26,'+(cx+11)+' 35 Z" fill="'+shade(color,-30)+'"/>';
}
function accentHornPair(cx, color){
  return '<path d="M'+(cx-16)+' 48 C'+(cx-24)+' 32,'+(cx-18)+' 14,'+(cx-9)+' 22 Z" fill="'+color+'"/>'+
         '<path d="M'+(cx+16)+' 48 C'+(cx+24)+' 32,'+(cx+18)+' 14,'+(cx+9)+' 22 Z" fill="'+color+'"/>';
}
var ACCENT_FN = { flame:accentFlame, drop:accentDrop, leaf:accentLeaf, ear:accentEarPair, horn:accentHornPair };

function bodyColorFor(sp){ return sp.fams.length===1 ? FAMILIES[sp.fams[0]].color : mixColor(FAMILIES[sp.fams[0]].color, FAMILIES[sp.fams[1]].color); }

function legsSvg(shape, dark){
  var cx=100;
  if(shape.legs===4){
    var xs=[-50,-20,20,50];
    var y1=Math.round(shape.cy+shape.ry*0.55), y2=Math.round(shape.cy+shape.ry*1.02);
    return '<g stroke="'+dark+'" stroke-width="8" stroke-linecap="round">'+
      xs.map(function(dx){ return '<line x1="'+(cx+dx)+'" y1="'+y1+'" x2="'+(cx+dx*1.08)+'" y2="'+y2+'"/>'; }).join('')+
    '</g>';
  }
  var y1=Math.round(shape.cy+shape.ry*0.62), y2=Math.round(shape.cy+shape.ry*0.98);
  return '<g stroke="'+dark+'" stroke-width="9" stroke-linecap="round">'+
    '<line x1="'+(cx-40)+'" y1="'+y1+'" x2="'+(cx-48)+'" y2="'+y2+'"/>'+
    '<line x1="'+(cx+40)+'" y1="'+y1+'" x2="'+(cx+48)+'" y2="'+y2+'"/>'+
  '</g>';
}
function topDecorSvg(shapeName, shape, color){
  var cx=100, topY=shape.cy-shape.ry;
  if(shapeName==='scallop'){
    return [-26,0,26].map(function(dx){ return '<circle cx="'+(cx+dx)+'" cy="'+(topY+10)+'" r="16" fill="'+color+'"/>'; }).join('');
  }
  if(shapeName==='wide'){
    return '<circle cx="'+cx+'" cy="'+(topY+8)+'" r="19" fill="'+color+'"/>';
  }
  if(shapeName==='peak'){
    return '<path d="M'+(cx-15)+' '+(topY+12)+' L'+cx+' '+(topY-16)+' L'+(cx+15)+' '+(topY+12)+' Z" fill="'+color+'"/>';
  }
  return '';
}
function wingsSvg(shape, color){
  var cx=100, cy=shape.cy-8, dark = shade(color,-20);
  return '<path d="M'+(cx-shape.rx+8)+' '+(cy-5)+' C'+(cx-shape.rx-38)+' '+(cy-22)+','+(cx-shape.rx-48)+' '+(cy+8)+','+(cx-shape.rx-30)+' '+(cy+32)+
    ' C'+(cx-shape.rx-18)+' '+(cy+14)+','+(cx-shape.rx-2)+' '+(cy+10)+','+(cx-shape.rx+10)+' '+(cy+16)+' Z" fill="'+dark+'" opacity=".92"/>'+
    '<path d="M'+(cx+shape.rx-8)+' '+(cy-5)+' C'+(cx+shape.rx+38)+' '+(cy-22)+','+(cx+shape.rx+48)+' '+(cy+8)+','+(cx+shape.rx+30)+' '+(cy+32)+
    ' C'+(cx+shape.rx+18)+' '+(cy+14)+','+(cx+shape.rx+2)+' '+(cy+10)+','+(cx+shape.rx-10)+' '+(cy+16)+' Z" fill="'+dark+'" opacity=".92"/>';
}
function tailSvg(shape, color){
  var cx=100, baseX = cx+shape.rx*0.8, baseY = shape.cy+shape.ry*0.25;
  return '<path d="M'+baseX+' '+baseY+' C'+(baseX+40)+' '+(baseY-8)+','+(baseX+58)+' '+(baseY-28)+','+(baseX+50)+' '+(baseY-46)+
    ' C'+(baseX+42)+' '+(baseY-26)+','+(baseX+25)+' '+(baseY-16)+','+(baseX+8)+' '+(baseY-10)+' Z" fill="'+color+'"/>';
}

function monsterSvg(speciesId){
  var sp = SPECIES[speciesId];
  var color = bodyColorFor(sp);

var actx = null;
function ctx(){ if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); } return actx; }
function beep(freq, dur, type, vol){
  try{
    var ac = ctx(); var o = ac.createOscillator(); var g = ac.createGain();
    o.type = type||"square"; o.frequency.value = freq; g.gain.value = vol||0.15;
    o.connect(g); g.connect(ac.destination);
    var now = ac.currentTime;
    g.gain.setValueAtTime(g.gain.value, now);
    g.gain.exponentialRampToValueAtTime(0.001, now+dur);
    o.start(now); o.stop(now+dur);
  }catch(e){}
}
function sfxTap(){ beep(440,0.08,"triangle",0.12); }
function sfxHit(){ beep(200,0.1,"square",0.18); }
function sfxFaint(){ [300,220,150].forEach(function(f,i){ setTimeout(function(){beep(f,0.15,"sawtooth",0.15);}, i*90); }); }

/* ============================== BATTLE ENGINE ============================== */
var MAX_LEVEL = 20;
function expToNext(level){ return level*8; }
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed>>>15), 1 | seed);
    t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t;
    return ((t ^ (t>>>14))>>>0) / 4294967296;
  };
}
function turnSeed(roomSeed, turn){ return ((roomSeed*1000003)+turn)>>>0; }

// a move a monster hasn't reached the level for yet, or an out-of-range/missing choice, safely falls back to its first move (always unlocked)
function equippedMoveIndex(speciesId, inst){
  var sp = SPECIES[speciesId];
  var idx = inst && inst.equippedSkillIndex;
  if(idx==null || !sp.moves[idx] || sp.moves[idx].unlockLevel > inst.level) return 0;
  return idx;
}
function toRuntime(inst){
  var statBonus = inst.statBonus || defaultStatBonus(inst.level);
  var stats = allStatsFromBonus(inst.speciesId, statBonus);
  var sp = SPECIES[inst.speciesId];
  var skillIdx = equippedMoveIndex(inst.speciesId, inst);
  return { uid:inst.uid, speciesId:inst.speciesId, level:inst.level, stats:stats, maxHp:stats.hp, currentHp:stats.hp, skillIndex:skillIdx, skillUses:sp.moves[skillIdx].uses };
}
function makeRuntimeTeam(instances){ return { monsters: instances.map(toRuntime), activeIndex:0, buffs:{ atk:{turnsLeft:0}, def:{turnsLeft:0} } }; }
var BUFF_MULTIPLIER = 1.5;
var BUFF_DURATION = 3; // number of the buffed side's own attacks (ATK) or hits taken (DEF) it lasts through
function aliveIndices(team){ var out=[]; team.monsters.forEach(function(m,i){ if(m.currentHp>0) out.push(i); }); return out; }
function isDefeated(team){ return aliveIndices(team).length===0; }

// NOTE: log entries are perspective-independent ({side:'A'|'B', ...}) so the SAME
// call (same argument order: team A, team B) can be made by both online players
// against identical shared state; only rendering maps A/B to "あなた"/"あいて"
// via the viewer's own role. A tie-break coin flip must never be interpreted
// relative to "who is calling this", or host and guest would each read the same
// rng() draw as favoring themselves.
function resolveTurn(teamA, actionA, teamB, actionB, rng){
  var log = [];
  teamA = JSON.parse(JSON.stringify(teamA));
  teamB = JSON.parse(JSON.stringify(teamB));
  function applySwitch(team, action, side){
    if(action && action.type==='switch'){
      var m = team.monsters[action.toIndex];
      if(m && m.currentHp>0){ team.activeIndex = action.toIndex; log.push({type:'switch', side:side, name:SPECIES[m.speciesId].name}); return true; }
    }
    return false;
  }
  var switchedA = applySwitch(teamA, actionA, 'A');
  var switchedB = applySwitch(teamB, actionB, 'B');
  function doAttack(attackerTeam, action, defenderTeam, side){
    var attacker = attackerTeam.monsters[attackerTeam.activeIndex];
    if(!attacker || attacker.currentHp<=0) return;
    var sp = SPECIES[attacker.speciesId];
    var move = action.type==='skill' ? sp.moves[attacker.skillIndex] : sp.attack;
    if(action.type==='skill'){ if(attacker.skillUses<=0){ move = sp.attack; } else { attacker.skillUses--; } }

    if(move.kind==='support'){
      attackerTeam.buffs[move.statKey].turnsLeft = BUFF_DURATION;
      log.push({type:'support', side:side, attackerName:SPECIES[attacker.speciesId].name, moveName:move.name, statKey:move.statKey});
      return;
    }

    var defender = defenderTeam.monsters[defenderTeam.activeIndex];
    if(!defender || defender.currentHp<=0) return;
    var atkBuff = attackerTeam.buffs.atk, atkMult = 1;
    if(atkBuff.turnsLeft>0){ atkMult = BUFF_MULTIPLIER; atkBuff.turnsLeft--; }
    var defBuff = defenderTeam.buffs.def, defMult = 1;
    if(defBuff.turnsLeft>0){ defMult = BUFF_MULTIPLIER; defBuff.turnsLeft--; }
    var result = computeDamage(attacker.speciesId, defender.speciesId, move.power, attacker.stats.atk*atkMult, defender.stats.def*defMult, rng);
    defender.currentHp = Math.max(0, defender.currentHp - result.damage);
    log.push({type:'move', side:side, attackerName:SPECIES[attacker.speciesId].name, moveName:move.name, damage:result.damage, multiplier:result.multiplier});
    if(defender.currentHp<=0){ log.push({type:'faint', side: side==='A'?'B':'A', name:SPECIES[defender.speciesId].name}); }
  }
  var aAttacks = !switchedA && actionA && (actionA.type==='attack'||actionA.type==='skill');
  var bAttacks = !switchedB && actionB && (actionB.type==='attack'||actionB.type==='skill');
  if(aAttacks && bAttacks){
    var activeA = teamA.monsters[teamA.activeIndex], activeB = teamB.monsters[teamB.activeIndex];
    var aFirst = activeA.stats.spd===activeB.stats.spd ? (rng()<0.5) : activeA.stats.spd>activeB.stats.spd;
    if(aFirst){ doAttack(teamA,actionA,teamB,'A'); doAttack(teamB,actionB,teamA,'B'); }
    else { doAttack(teamB,actionB,teamA,'B'); doAttack(teamA,actionA,teamB,'A'); }
  } else if(aAttacks){ doAttack(teamA,actionA,teamB,'A'); }
  else if(bAttacks){ doAttack(teamB,actionB,teamA,'B'); }

  var needsReplacementA = teamA.monsters[teamA.activeIndex].currentHp<=0 && !isDefeated(teamA);
  var needsReplacementB = teamB.monsters[teamB.activeIndex].currentHp<=0 && !isDefeated(teamB);
  return { teamA:teamA, teamB:teamB, log:log, needsReplacementA:needsReplacementA, needsReplacementB:needsReplacementB, aDefeated:isDefeated(teamA), bDefeated:isDefeated(teamB) };
}

// viewerIsA: true if the person looking at the screen owns team A in this battle's canonical A/B assignment
function formatLogEntry(entry, viewerIsA){
  var mine = (entry.side==='A') === viewerIsA;
  if(entry.type==='switch') return (mine?'あなた':'あいて')+'は '+entry.name+' にこうたいした！';
  if(entry.type==='faint') return entry.name+'は たおれた！';
  if(entry.type==='support'){
    var statName = entry.statKey==='atk' ? 'こうげき' : 'ぼうぎょ';
    return (mine?'あなた':'あいて')+'の '+entry.attackerName+'の '+entry.moveName+'！ みかたぜんいんの '+statName+'が あがった！';
  }
  var eff = entry.multiplier>1 ? '(こうかは ばつぐんだ！)' : (entry.multiplier<1 ? '(こうかは いまひとつ...)' : '');
  return (mine?'あなた':'あいて')+'の '+entry.attackerName+'の '+entry.moveName+'！ '+entry.damage+'ダメージ '+eff;
}
function formatLog(entries, viewerIsA){ return entries.map(function(e){ return formatLogEntry(e, viewerIsA); }); }

   Fill in FIREBASE_CONFIG (see README) to enable online battles. Nothing else in this game
   depends on Firebase, so the rest of the game works fine while this is left as a placeholder.

   Sync model: the two players never trust each other's computed results, only their raw
   move CHOICES. Both clients independently run the exact same deterministic resolveTurn()
   with a seed shared at room creation, so given the same two actions for a turn they always
   compute identical damage/outcomes with no server-side authority needed. Canonically "team A"
   is always the room host and "team B" is always the guest (regardless of which browser is
   running the code) so a tie-break coin flip can never be read backwards by the two clients;
   only the RENDER layer maps A/B to "you"/"opponent" for whoever is looking at the screen. */

var CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O/1/I, avoids look-alike mixups
function randomRoomCode(){
  var s = '';
  for(var i=0;i<4;i++){ s += CODE_ALPHABET[Math.floor(Math.random()*CODE_ALPHABET.length)]; }
  return s;

function currentTeamInfo(){

function createOnlineRoom(){
  if(!initFirebase()){ toast('Firebaseの せっていが まだだよ（READMEをみてね）'); return; }
  if(G.party.length !== 3){ toast('パーティを3匹にしてね'); return; }
  var code = randomRoomCode();
  var seed = Math.floor(Math.random()*1e9);
  var roomRef = fbDb.ref('rooms/'+code);
  roomRef.set({ seed:seed, createdAt:Date.now(), host:{ team:currentTeamInfo() } }).then(function(){
    G.online = { role:'host', code:code, seed:seed, roomRef:roomRef, hostTeamInfo:currentTeamInfo(), guestTeamInfo:null,
      hostTeam:null, guestTeam:null, resolvedTurn:0, mySubmittedTurn:-1, log:[], ended:false, result:null, showSwitchMenu:false };
    G.screen = 'onlineBattle';
    attachRoomListener();
    render();
  }).catch(function(err){ toast('さくせいに しっぱいしたよ'); console.error(err); });
}

function joinOnlineRoom(codeRaw){
  if(!initFirebase()){ toast('Firebaseの せっていが まだだよ（READMEをみてね）'); return; }
  if(G.party.length !== 3){ toast('パーティを3匹にしてね'); return; }
  var code = codeRaw.toUpperCase();
  var roomRef = fbDb.ref('rooms/'+code);
  roomRef.once('value').then(function(snap){
    var val = snap.val();
    if(!val){ toast('その コードは みつからないよ'); return; }
    if(val.guest){ toast('その へやは まんいんだよ'); return; }
    return roomRef.child('guest').set({ team:currentTeamInfo() }).then(function(){
      G.online = { role:'guest', code:code, seed:val.seed, roomRef:roomRef, hostTeamInfo:val.host.team, guestTeamInfo:currentTeamInfo(),
        hostTeam:null, guestTeam:null, resolvedTurn:0, mySubmittedTurn:-1, log:[], ended:false, result:null, showSwitchMenu:false };
      G.screen = 'onlineBattle';
      attachRoomListener();
      render();
    });
  }).catch(function(err){ toast('さんかに しっぱいしたよ'); console.error(err); });
}

function attachRoomListener(){
  var on = G.online;
  on.roomRef.on('value', function(snap){
    if(!G.online || G.online.code !== on.code) return; // stale listener from a room we already left
    onRoomSnapshot(snap.val() || {});
  });
}

function onRoomSnapshot(val){
  var on = G.online;
  if(val.host && val.host.team) on.hostTeamInfo = val.host.team;
  if(val.guest && val.guest.team) on.guestTeamInfo = val.guest.team;
  if(!on.hostTeam && on.hostTeamInfo && on.guestTeamInfo){
    on.hostTeam = runtimeTeamFromInfo(on.hostTeamInfo);
    on.guestTeam = runtimeTeamFromInfo(on.guestTeamInfo);
    on.log.push('たいせん かいし！');
  }
  if(val.forfeit && val.forfeit !== on.role && !on.ended){
    on.ended = true; on.result = 'win';
    on.log.push('あいてが たいせんを ぬけた…');
    on.log.push('🎉 あなたの かち！');
    sfxWin();
    if(G.screen === 'onlineBattle') render();
    return;
  }
  var actions = val.actions || {};
  while(on.hostTeam && on.guestTeam && !on.ended){
    var hAct = actions.host && actions.host['t'+on.resolvedTurn];
    var gAct = actions.guest && actions.guest['t'+on.resolvedTurn];
    if(!hAct || !gAct) break;
    var rng = mulberry32(turnSeed(on.seed, on.resolvedTurn));
    var res = resolveTurn(on.hostTeam, hAct, on.guestTeam, gAct, rng);
    on.hostTeam = res.teamA; on.guestTeam = res.teamB;
    var viewerIsA = on.role === 'host';
    on.log = on.log.concat(formatLog(res.log, viewerIsA));
    on.resolvedTurn++;
    var myDefeated = viewerIsA ? res.aDefeated : res.bDefeated;
    var oppDefeated = viewerIsA ? res.bDefeated : res.aDefeated;
    if(myDefeated || oppDefeated){
      on.ended = true;
      on.result = oppDefeated && !myDefeated ? 'win' : (myDefeated && !oppDefeated ? 'lose' : 'draw');
      on.log.push(on.result==='win' ? '🎉 あなたの かち！' : (on.result==='lose' ? 'あなたの まけ…' : 'ひきわけ！'));
      if(on.result==='win'){ sfxWin(); } else { sfxFaint(); }
    }
  }
  if(G.screen === 'onlineBattle') render();
}

function submitOnlineAction(action){
  var on = G.online;
  if(!on || on.ended) return;
  on.mySubmittedTurn = on.resolvedTurn;
  on.showSwitchMenu = false;
  on.roomRef.child('actions/'+on.role+'/t'+on.resolvedTurn).set(action);
  sfxHit();
  render();
}

function leaveOnline(){
  if(G.online && G.online.roomRef){
    if(!G.online.ended && G.online.hostTeam && G.online.guestTeam){
      try{ G.online.roomRef.child('forfeit').set(G.online.role); }catch(e){}
    }
    try{ G.online.roomRef.off(); }catch(e){}
  }
  G.online = null;
  G.screen = 'home';
  render();
}

var SAVE_KEY = 'monsterArenaSave_v1';
var G = {

};

    localStorage.setItem(SAVE_KEY, JSON.stringify({ box:G.box, party:G.party, nextUid:G.nextUid, starterPicked:G.starterPicked }));
  }catch(e){}
}
function load(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    var data = JSON.parse(raw);
    G.box = data.box||[]; G.party = data.party||[]; G.nextUid = data.nextUid||1; G.starterPicked = !!data.starterPicked;
    // migrate saves from before per-stat level-up choices existed
    G.box.forEach(function(m){ if(!m.statBonus){ m.statBonus = defaultStatBonus(m.level); } });
    return G.starterPicked;
  }catch(e){ return false; }
}
function newUid(){ return 'm'+(G.nextUid++); }
function findMon(uid){ return G.box.find(function(m){ return m.uid===uid; }); }
function boxWithout(uids){ return G.box.filter(function(m){ return uids.indexOf(m.uid)===-1; }); }

function addMonster(speciesId, level){
  level = level||1;
  var inst = { uid:newUid(), speciesId:speciesId, level:level, exp:0, statBonus:defaultStatBonus(level) };
  G.box.push(inst);
  return inst;
}
// returns how many levels were gained; stat growth for those levels is NOT applied here —
// the caller queues one stat-choice prompt per level via G.levelUpQueue
function gainExp(inst, amount){
  inst.exp += amount;
  var levelsGained = 0;
  while(inst.level < MAX_LEVEL && inst.exp >= expToNext(inst.level)){
    inst.exp -= expToNext(inst.level);
    inst.level++;
    levelsGained++;
  }
  if(inst.level >= MAX_LEVEL) inst.exp = 0;
  return levelsGained;
}

function pickWildLevel(stage){
  return stage.minLv + Math.floor(Math.random()*(stage.maxLv-stage.minLv+1));
}

function startWildBattle(stageId){
  var stage = STAGES.filter(function(s){ return s.id===stageId; })[0] || STAGES[0];
  var wildSpecies = BASE_SPECIES_IDS[Math.floor(Math.random()*BASE_SPECIES_IDS.length)];
  var wildLevel = pickWildLevel(stage);
  var playerInstances = G.party.map(findMon);
  var teamPlayer = makeRuntimeTeam(playerInstances);
  var teamWild = makeRuntimeTeam([{ uid:'wild', speciesId:wildSpecies, level:wildLevel }]);
  G.battle = {
    mode:'wild', turn:0, seed: Math.floor(Math.random()*1e9), viewerIsA:true,
    teamA: teamPlayer, teamB: teamWild,
    log: ['やせいの '+SPECIES[wildSpecies].name+'(Lv'+wildLevel+') が あらわれた！'],
    ended:false, needsReplacementA:false, awaitingAction:true
  };
  G.screen = 'battle';
  render();
}

function wildCpuAction(teamB, teamA){
  var active = teamB.monsters[teamB.activeIndex];
  if(active.currentHp <= 0){
    var alive = aliveIndices(teamB).filter(function(i){ return i!==teamB.activeIndex; });
    return { type:'switch', toIndex: alive[0] };
  }
  if(active.currentHp < active.maxHp*0.3 && Math.random()<0.4){
    var bench = aliveIndices(teamB).filter(function(i){ return i!==teamB.activeIndex; });
    if(bench.length) return { type:'switch', toIndex:bench[0] };
  }
  return active.skillUses>0 && Math.random()<0.7 ? {type:'skill'} : {type:'attack'};
}

function renderHpBar(m){
  var pct = Math.max(0, Math.round(m.currentHp/m.maxHp*100));
  var cls = pct<=25?'low':(pct<=55?'mid':'');
  return '<div class="hpBarOuter"><div class="hpBarInner '+cls+'" style="width:'+pct+'%"></div></div>'+
         '<div class="hpText">HP '+m.currentHp+' / '+m.maxHp+'</div>';
}

function playerAct(action){
  var b = G.battle;
  if(!b || b.ended || b.needsReplacementA) return;
  b.showSwitchMenu = false;
  var rng = mulberry32(turnSeed(b.seed, b.turn));
  var cpuAction = wildCpuAction(b.teamB, b.teamA);
  var res = resolveTurn(b.teamA, action, b.teamB, cpuAction, rng);
  b.teamA = res.teamA; b.teamB = res.teamB;
  b.log = b.log.concat(formatLog(res.log, b.viewerIsA));
  b.turn++;
  sfxHit();

  if(res.bDefeated){
    b.ended = true; b.result = 'win';
    var wildLevel = b.teamB.monsters[0].level;
    var expGain = wildLevel*6+4;
    var msgs = [];
    G.party.forEach(function(uid){
      var inst = findMon(uid);
      var levelsGained = gainExp(inst, expGain);
      msgs.push(SPECIES[inst.speciesId].name+'は '+expGain+'けいけんちを かくとく'+(levelsGained>0?'！ レベルアップ！(Lv'+inst.level+')':'！'));
      for(var i=0;i<levelsGained;i++){ G.levelUpQueue.push(uid); }
    });
    b.log = b.log.concat(msgs);
    var caught = Math.random() < 0.3;
    if(caught){
      addMonster(b.teamB.monsters[0].speciesId, wildLevel);
      b.log.push('やせいの '+SPECIES[b.teamB.monsters[0].speciesId].name+'を なかまにした！');
      sfxCatch();
    } else {
      b.log.push('やせいの '+SPECIES[b.teamB.monsters[0].speciesId].name+'は にげてしまった…');
      sfxWin();
    }
    save();
    render();
    return;
  }
  if(res.aDefeated){
    b.ended = true; b.result = 'lose';
    b.log.push('あなたの パーティは ぜんめつしてしまった…');
    render();
    return;
  }
  if(res.needsReplacementA){
    b.needsReplacementA = true;
    sfxFaint();
    render();
    return;
  }
  render();
}

app.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.getAttribute('data-action');
  if(!action) return;
  resumeAudio();
  sfxTap();

  if(action==='pick-starter'){
    var speciesId = el.getAttribute('data-species');
    var inst = addMonster(speciesId, 5);
    G.party = [inst.uid];
    G.starterPicked = true;
    save();
    G.screen = 'home';
    toast(SPECIES[speciesId].name+'を なかまにした！');
    render();
  } else if(action==='go-wild'){ G.screen='wild'; render(); }
  else if(action==='start-wild'){ startWildBattle(el.getAttribute('data-stage')); }
  else if(action==='go-synth'){ G.synthSelect=[]; G.screen='synth'; render(); }
  else if(action==='go-party'){ G.screen='party'; render(); }
  else if(action==='go-online'){
    if(G.party.length!==3){ toast('パーティを3匹にえらんでね'); G.screen='party'; }
    else { G.screen='onlineMenu'; }
    render();
  }
  else if(action==='back-home'){ G.screen='home'; render(); }
  else if(action==='online-create'){ createOnlineRoom(); }
  else if(action==='online-join'){
    var codeInput = document.getElementById('joinCodeInput');
    var codeVal = codeInput ? codeInput.value.trim() : '';
    if(codeVal.length!==4){ toast('4もじの コードを いれてね'); return; }
    joinOnlineRoom(codeVal);
  }
  else if(action==='online-leave'){ leaveOnline(); }
  else if(action==='online-attack'){ submitOnlineAction({type:'attack'}); }
  else if(action==='online-skill'){ if(el.classList.contains('disabled')) return; submitOnlineAction({type:'skill'}); }
  else if(action==='online-show-switch'){ G.online.showSwitchMenu = !G.online.showSwitchMenu; render(); }
  else if(action==='online-switch'){
    if(el.classList.contains('disabled')) return;
    var oIdx = parseInt(el.getAttribute('data-idx'),10);
    submitOnlineAction({type:'switch', toIndex:oIdx});
  }
  else if(action==='toggle-party'){
    var uid = el.getAttribute('data-uid');
    var idx = G.party.indexOf(uid);
    if(idx!==-1){ G.party.splice(idx,1); }
    else if(G.party.length<3){ G.party.push(uid); }
    else { toast('パーティは さいだい3匹まで！'); }
    save();
    render();
  } else if(action==='set-skill'){
    if(el.classList.contains('disabled')) return;
    var skUid = el.getAttribute('data-uid');
    var skInst = findMon(skUid);
    var skIdx = parseInt(el.getAttribute('data-idx'),10);
    if(skInst){ skInst.equippedSkillIndex = skIdx; save(); }
    render();
  } else if(action==='toggle-synth'){
    var uid2 = el.getAttribute('data-uid');
    var idx2 = G.synthSelect.indexOf(uid2);
    if(idx2!==-1){ G.synthSelect.splice(idx2,1); }
    else if(G.synthSelect.length<2){ G.synthSelect.push(uid2); }
    render();
  } else if(action==='do-synth'){
    var resultId = el.getAttribute('data-result');
    var newLevel = parseInt(el.getAttribute('data-newlevel'),10);
    var consumedUids = G.synthSelect.slice();
    G.box = boxWithout(consumedUids);
    G.party = G.party.filter(function(uid){ return consumedUids.indexOf(uid)===-1; });
    var newInst = addMonster(resultId, newLevel);
    G.synthSelect = [];
    save();
    toast(SPECIES[resultId].name+'が うまれた！');
    G.screen='home';
    render();
  } else if(action==='do-attack'){ playerAct({type:'attack'}); }
  else if(action==='do-skill'){ if(el.classList.contains('disabled')) return; playerAct({type:'skill'}); }
  else if(action==='show-switch'){ G.battle.showSwitchMenu = !G.battle.showSwitchMenu; render(); }
  else if(action==='do-switch'){
    var idx3 = parseInt(el.getAttribute('data-idx'),10);
    if(el.classList.contains('disabled')) return;
    if(G.battle.needsReplacementA){
      G.battle.teamA.activeIndex = idx3;
      G.battle.needsReplacementA = false;
      render();
    } else {
      playerAct({type:'switch', toIndex:idx3});
    }
  } else if(action==='battle-flee'){
    G.battle = null; G.screen='home'; render();
  } else if(action==='battle-end-ok'){
    G.battle = null;
    G.screen = G.levelUpQueue.length>0 ? 'levelUp' : 'home';
    render();
  } else if(action==='level-up-choose'){
    var luUid = G.levelUpQueue.shift();
    var luInst = findMon(luUid);
    var luStat = el.getAttribute('data-stat');
    if(luInst){ luInst.statBonus[luStat] = (luInst.statBonus[luStat]||0) + 1; save(); }
    G.screen = G.levelUpQueue.length>0 ? 'levelUp' : 'home';
    render();
  } else if(action==='view-mon'){
    G.viewMonUid = el.getAttribute('data-uid');
    G.screen = 'monDetail';
    render();
  }
});

/* ============================== BOOT ============================== */
function boot(){
  var hasSave = load();
  G.screen = hasSave ? 'home' : 'title';
  render();
}
boot();
</script>
</body>
</html>
